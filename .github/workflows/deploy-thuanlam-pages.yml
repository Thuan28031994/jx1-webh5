name: Deploy thuanlam.qzz.io (Pages)

# Main is source-of-truth after merge. Unlike deploy-web.yml this deploys
# Cloudflare PAGES vli-thuan-2026, not the upstream Cloudflare Worker.
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'game/**'
      - '.github/workflows/deploy-thuanlam-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: thuanlam-pages-production
  cancel-in-progress: false

jobs:
  deploy:
    # Guard is OFF until all local Patch 01 media have been committed and
    # the Cloudflare repository secrets are configured (see docs).
    if: vars.VLI_PAGES_AUTO_DEPLOY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Verify Pages credentials configured
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ]; then
            echo "::error::Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as GitHub Actions secrets."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: web

      - name: TypeScript typecheck
        run: npm run typecheck
        working-directory: web

      - name: Build isolated static artifact (no mutation of game)
        run: npm run android:sync -- --out patch02-test-out
        working-directory: web

      - name: Verify full Patch 01 media and Pages asset limits
        shell: bash
        run: |
          set -euo pipefail
          dest="patch02-test-out"
          for f in index.html jdata/jx.json; do
            test -f "$dest/$f" || { echo "::error::Missing file $dest/$f"; exit 1; }
          done
          test -d "$dest/_next" && test -d "$dest/img" && test -d "$dest/fx" && test -d "$dest/ui" ||
            { echo "::error::Missing expected static directories"; exit 1; }
          for f in fx/c2_101.webp img/a/ani050_st.webp img/jx/f/fm_bd_025_st05.webp; do
            test -f "$dest/$f" || { echo "::error::Patch 01 media missing: $f. Import all local media to Git before enabling deploy."; exit 1; }
          done
          test -d "$dest/ui/jx1" ||
            { echo "::error::Missing Patch 01 UI directory ui/jx1"; exit 1; }
          count=$(find "$dest" -type f | wc -l)
          echo "Packaged files: $count"
          if [ "$count" -lt 11500 ] || [ "$count" -gt 20000 ]; then
            echo "::error::Expected 11500..20000 files incl. Patch 01 media; got $count"
            exit 1
          fi
          bad=$(find "$dest" -type f -size +25M -print -quit)
          if [ -n "$bad" ]; then
            echo "::error::Pages asset exceeds 25 MiB: $bad"
            exit 1
          fi

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: web

      - name: Regression against packaged artifact
        env:
          VLI_PATCH02_TEST: '1'
        run: npx playwright test --workers=4
        working-directory: web

      - name: Upload to Cloudflare Pages production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.151.3 pages deploy patch02-test-out --project-name=vli-thuan-2026 --branch=main --commit-dirty=true

      - name: Verify both public hostnames respond
        shell: bash
        run: |
          set -euo pipefail
          for url in https://vli-thuan-2026.pages.dev/ https://thuanlam.qzz.io/; do
            echo "Checking $url"
            curl --fail --location --silent --show-error --retry 4 --retry-delay 3 --max-time 30 --output /dev/null "$url"
          done
          echo "Both Pages hostnames respond with HTTP success."
