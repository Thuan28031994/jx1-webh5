name: Deploy web (Cloudflare)

# Deploy thu muc game/ (Next static export da sync — CUNG artifact voi OTA Android)
# len Worker vo-lam-idle.tannhatcms.io.vn.
# Cap nhat web: chay `cd web && npm run android:sync` roi commit game/ (dung quy
# trinh OTA) — web va app luon dong bo, khong build lai trong CI (tranh hash chunk
# doi moi lan chay).
# Can dat 2 secret trong repo settings (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN  — token co quyen "Edit Cloudflare Workers"
#   CLOUDFLARE_ACCOUNT_ID — account id Cloudflare
on:
  push:
    branches: [main]
    # Deploy only when runtime code/static-export changes.
    # Importing binary Patch 01 media must NOT redeploy the upstream Worker.
    paths:
      - 'game/_next/**'
      - 'game/index.html'
      - 'game/style.css'
      - 'game/manifest.json'
      - 'game/js/**'
      - 'wrangler.jsonc'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Deploy lên Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Worker chi co `assets` (khong co `main`): wrangler 3.x bao "Missing entry-point",
          # phai dung wrangler >= 4 moi deploy duoc dang assets-only.
          wranglerVersion: '4'
          command: deploy
